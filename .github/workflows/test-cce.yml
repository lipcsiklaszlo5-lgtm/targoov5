name: CCE Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  Quick-Check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Run cargo check
        run: cargo check 2>&1 | tee check-output.txt

      - name: Upload check output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-output
          path: check-output.txt

  Build:
    needs: Quick-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          
      - name: Build Release
        run: cargo build --release
        
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: targoo-v2-backend
          path: target/release/targoo-v2

  test-cce:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: targoo-v2-backend

      - name: Make binary executable
        run: |
          if [ -f "targoo-v2" ]; then
            chmod +x targoo-v2
          else
            echo "Binary not found in root, searching..."
            find . -name "targoo-v2" -exec chmod +x {} \;
            find . -name "targoo-v2" -exec cp {} . \;
          fi

      - name: Run HU CBAM Test
        run: |
          mkdir -p /tmp/hu_test
          ./targoo-v2 --input test_100.csv --config config/profiles/hu_cbam_quick.json --output-override /tmp/hu_test/
          
      - name: Run DE Scope3 Test
        run: |
          mkdir -p /tmp/de_test
          ./targoo-v2 --input test_100.csv --config config/profiles/de_scope3_lksg.json --output-override /tmp/de_test/

      - name: Verify Results
        run: |
          echo "Checking output directories..."
          ls -R /tmp/hu_test/
          ls -R /tmp/de_test/
          
          HU_ZIP=$(find /tmp/hu_test -name "*.zip")
          DE_ZIP=$(find /tmp/de_test -name "*.zip")
          
          if [ -n "$HU_ZIP" ] && [ -n "$DE_ZIP" ]; then
            echo "✅ CCE TESZT SIKERES"
            echo "HU Output: $HU_ZIP"
            echo "DE Output: $DE_ZIP"
          else
            echo "❌ CCE TESZT SIKERTELEN"
            if [ -z "$HU_ZIP" ]; then echo "Hiányzó HU kimenet!"; fi
            if [ -z "$DE_ZIP" ]; then echo "Hiányzó DE kimenet!"; fi
            exit 1
          fi
