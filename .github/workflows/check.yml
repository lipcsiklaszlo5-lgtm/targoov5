name: Cargo Check

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Run cargo check
        run: cargo check 2>&1 | tee /tmp/check-output.txt
      - name: Upload check output
        uses: actions/upload-artifact@v4
        with:
          name: check-output
          path: /tmp/check-output.txt
