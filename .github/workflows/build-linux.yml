name: Build Targoo V2 Backend

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          
      - name: Build Release
        run: cargo build --release
        
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: targoo-v2-backend
          path: target/release/targoo-v2
